project:
  type: website
  output-dir: _site
  pre-render: herramientas/paginas.ts
  resources: ["js/*.mjs", "datos/*.json", "laboratorios/*.json", "aspecto/*.json", "fotos/*", "recetas/*.json"]
  render: ["*.qmd", "fundamentos/*.qmd", "piel/*.qmd", "limpieza/*.qmd", "solar/*.qmd", "maquillaje/*.qmd", "cabello/*.qmd", "fragancias/*.qmd", "calculadoras/*.qmd", "laboratorio/*.qmd", "producto/*.qmd", "guias/*.qmd"]
website:
  title: "Cuaderno de formulación"
  site-url: "https://mancha504daj-gif.github.io/cuaderno-de-formulacion/"
  repo-url: "https://github.com/mancha504daj-gif/cuaderno-de-formulacion"
  description: "Formulación cosmética con cálculos a la vista y fuentes citadas."
  search: { location: sidebar, type: overlay }
  sidebar:
    style: docked
    search: true
    contents:
      - { text: Inicio, href: index.qmd }
      - text: "---"
      - { text: Cuidado de la piel, href: piel/index.qmd }
      - { text: Limpieza, href: limpieza/index.qmd }
      - { text: Protección solar, href: solar/index.qmd }
      - { text: Maquillaje, href: maquillaje/index.qmd }
      - { text: Cabello, href: cabello/index.qmd }
      - { text: Fragancias, href: fragancias/index.qmd }
      - text: "---"
      - { text: Primeros pasos, href: fundamentos/primeros-pasos.qmd }
      - { text: En el laboratorio, href: fundamentos/laboratorio.qmd }
      - { text: Emulsiones, href: fundamentos/emulsiones.qmd }
      - { text: Conservación, href: fundamentos/conservacion.qmd }
      - { text: Microbiología, href: fundamentos/microbiologia.qmd }
      - { text: Estabilidad, href: fundamentos/estabilidad.qmd }
      - { text: De dónde salen las fórmulas, href: modelos.qmd }
      - { text: Glosario, href: glosario.qmd }
      - { text: Ingredientes, href: ingredientes.qmd }
      - text: "---"
      - { text: Guías de laboratorio, href: guias/index.qmd }
      - { text: Laboratorios virtuales, href: laboratorios.qmd }
      - { text: Calculadoras, href: calculadoras/index.qmd }
      - { text: Mis recetas, href: mis-recetas.qmd }
      - { text: Mis ensayos, href: cuaderno.qmd }
      - { text: Mi cuenta, href: cuenta.qmd }
      - text: "---"
      - { text: Editor, href: editor.qmd }
      - { text: Del cuaderno al registro, href: honduras.qmd }
      - { text: Alcance, href: alcance.qmd }
      - { text: Créditos de las fotos, href: creditos.qmd }
lang: es
bibliography: referencias.bib
link-citations: true
format:
  html:
    theme: [default, css/estilo.scss]
    toc: true
    link-external-newwindow: false
    include-after-body:
      text: |
        <script type="module">
        const o = document.querySelector('meta[name="quarto:offset"]')?.content ?? "./";
        await import(new URL(o + "js/sitio.mjs", location.href).href);
        </script>
